<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Opening Spotify…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script>
    // Deep link
    const spotifyApp = "spotify:track:3njo0yIbZ4cEztin4HNvic";

    // Fallback
    const spotifyWeb = "https://open.spotify.com/track/3njo0yIbZ4cEztin4HNvic";

    let pageHidden = false;

    // Se la pagina diventa "nascosta" (app aperta / si esce dal browser),
    // NON dobbiamo più fare il fallback.
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        pageHidden = true;
      }
    });

    window.addEventListener("pagehide", function () {
      pageHidden = true;
    });

    window.addEventListener("load", function () {
      // 1) Prova ad aprire l’app
      window.location = spotifyApp;

      // 2) Se dopo 1.2s la pagina è ancora visibile,
      // vuol dire che l'app NON si è aperta → vai su web
      setTimeout(function () {
        if (!pageHidden) {
          window.location = spotifyWeb;
        }
      }, 1200);
    });
  </script>

  <style>
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: white;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  Redirecting to Spotify… now2
</body>
</html>
