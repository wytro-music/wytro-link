<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Open in Spotify</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    button {
      padding: 1rem 2rem;
      border: none;
      border-radius: 999px;
      background: #1db954;
      color: #000;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 2rem;
    }

    #version {
      position: fixed;
      bottom: 1rem;
      font-size: 0.8rem;
      color: #6b7280;
    }
  </style>
</head>

<body>

  <button id="openAppButton">
    Open in Spotify
  </button>

  <div id="version">v2b</div> <!-- incrementa qui -->

  <script>
    const spotifyApp = "spotify:track:3njo0yIbZ4cEztin4HNvic";
    const spotifyWeb = "https://open.spotify.com/track/3njo0yIbZ4cEztin4HNvic";

    let hidden = false;

    // Se la pagina viene nascosta → l’app si è aperta → NON fare fallback
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") hidden = true;
    });

    document.getElementById("openAppButton").addEventListener("click", function () {
      hidden = false;

      // Tentativo apertura app
      window.location = spotifyApp;

      // Fallback solo se l'app NON si apre
      setTimeout(() => {
        if (!hidden) window.location = spotifyWeb;
      }, 5000);
    });
  </script>

</body>
</html>
